# Session 15: this is the CONFORMING base — self-contained image (no bind
# mount), RAILS_ENV=production, no dev toolchain running. For local development
# (bind mount, RAILS_ENV=development, bin/dev with tailwindcss:watch), run
# `docker compose up` from *this directory* instead of the repo root:
# docker-compose.override.yml next to this file re-adds those conveniences and
# Compose auto-loads it.

services:
  estimator-web:
    build: .
    container_name: estimator-web
    ports:
      - "3000:3000"            # the only public entry point in the full stack

    # SECRET_KEY_BASE, AI_SERVICE_TOKEN, RETRIEVAL_API_KEY, ESTIMATE_API_KEY come
    # from THIS file (resolved relative to this directory even when `include:`d
    # from the root compose — NOT via ${VAR} interpolation in this YAML, which
    # would instead resolve against the root's own .env/shell env when invoked
    # from the repo root and silently blank these out).
    env_file:
      - path: .env
        required: false

    # Explicit overrides so the service works even if .env is missing values.
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
      # No TLS-terminating proxy in front locally — see config/environments/production.rb.
      RAILS_FORCE_SSL: "false"
      RAILS_ASSUME_SSL: "false"
      # FastAPI estimator URL — Rails calls it server-side via docker DNS. Not
      # reachable from the host: the estimator publishes no port (see
      # ../estimator/docker-compose.yml).
      ESTIMATOR_API_BASE_URL: http://estimator:8000
      # LLM calls over long transcriptions can take 1-2 min; leave plenty of head room.
      ESTIMATOR_AI_TIMEOUT: "180"

    depends_on:
      postgres:
        condition: service_healthy

    # Persist ActiveStorage (:local) uploads across restarts. No bind mount, no
    # bundle_cache/node_modules — the image already carries the gems and code.
    volumes:
      - storage_data:/rails/storage

    # Drop stale PID from previous runs, prepare the (multi-db: primary + solid_cache
    # + solid_queue + solid_cable) databases, then start Puma directly — no bin/dev,
    # no tailwindcss:watch, assets are already precompiled into the image.
    command: >
      bash -c "rm -f tmp/pids/server.pid &&
               bin/rails db:prepare &&
               bin/rails server -b 0.0.0.0 -p 3000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5

    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: estimator-web-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # The development DB is created on first boot. The test DB is created by
      # `bin/rails db:prepare` during the web service command.
      POSTGRES_DB: estimator_web_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  storage_data:
